[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "pinnx.__version__" }


[project]
name = "pinnx"
description = "Physics-Informed Neural Networks for Scientific Machine Learning in JAX."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "PINNx Developers", email = "chao.brain@qq.com" }]
keywords = [
    "computational neuroscience",
    "brain-inspired computation",
    "brain dynamics programming",
]
classifiers = [
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "jax>=0.9.0",
    "numpy",
    "scipy",
    "matplotlib",
    "brainunit>=0.2.1",
    "brainstate>=0.5.0",
    "braintools>=0.3.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/chaobrain/pinnx"
Documentation = "https://pinnx.readthedocs.io/"
"Source Code" = "https://github.com/chaobrain/pinnx"
"Bug Tracker" = "https://github.com/chaobrain/pinnx/issues"

[project.optional-dependencies]
cpu = ["jax[cpu]>=0.9.0"]
cuda12 = ["jax[cuda12]>=0.9.0"]
cuda13 = ["jax[cuda13]>=0.9.0"]
tpu = ["jax[tpu]>=0.9.0"]
testing = ["pytest", "pytest-cov"]

[tool.setuptools.package-data]
pinnx = ["py.typed"]

[tool.setuptools.packages.find]
exclude = [
    "dev*",
    "docs*",
    "tests*",
    "examples*",
    "experiments*",
    "build*",
    "dist*",
    "pinnx.egg-info*",
    "pinnx/__pycache__*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
